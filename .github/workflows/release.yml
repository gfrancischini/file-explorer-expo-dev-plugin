name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun install

      - name: Install webui dependencies
        run: cd webui && bun install

      - name: Build
        run: bun run build:all

      - name: Resolve target branch
        id: target
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "branch=release/${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "branch=release" >> $GITHUB_OUTPUT
          fi

      - name: Publish to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/ dist/
          git diff --staged --quiet || git commit -m "chore: build artifacts [skip ci]"
          git push origin HEAD:${{ steps.target.outputs.branch }} --force
